# Publishes the site to GitHub Pages (https://ilikeanushashetty.github.io/project1/)
# on every push to main. Turn it on once: repository Settings -> Pages -> Source: GitHub Actions.
# Netlify is separate and keeps building for the root of its own domain.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: https://ilikeanushashetty.github.io
          SITE_BASE: /project1
      - run: node scripts/prefix-base.mjs dist /project1
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
